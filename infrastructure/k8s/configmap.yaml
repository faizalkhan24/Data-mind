apiVersion: v1
kind: ConfigMap
metadata:
  name: datamind-config
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-config
    app.kubernetes.io/part-of: datamind
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "datamind"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  PREDICTION_SERVICE_URL: "http://datamind-prediction:8000"
  FLEET_API_URL: "http://datamind-api:8001"
  INGESTION_SERVICE_URL: "http://datamind-ingestion:8002"
  DASHBOARD_SERVICE_URL: "http://datamind-dashboard:8003"
  STREAM_WORKER_CONCURRENCY: "4"
  STREAM_QUEUE_MAX_SIZE: "20000"
  ENABLE_PROMETHEUS_METRICS: "true"
