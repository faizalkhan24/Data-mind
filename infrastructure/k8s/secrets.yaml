apiVersion: v1
kind: Secret
metadata:
  name: datamind-secrets
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-secrets
    app.kubernetes.io/part-of: datamind
type: Opaque
stringData:
  POSTGRES_USER: "datamind_admin"
  POSTGRES_PASSWORD: "datamind_production_secret_key_change_me"
  DATABASE_URL: "postgresql+asyncpg://datamind_admin:datamind_production_secret_key_change_me@postgres:5432/datamind"
  SECRET_KEY: "prod-insecure-key-sample-replace-with-kms-or-vault-secret"
