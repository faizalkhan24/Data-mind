apiVersion: v1
kind: Service
metadata:
  name: datamind-ingestion
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-ingestion
    app.kubernetes.io/part-of: datamind
    app.kubernetes.io/component: ingestion
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  selector:
    app.kubernetes.io/name: datamind-ingestion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datamind-ingestion
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-ingestion
    app.kubernetes.io/part-of: datamind
    app.kubernetes.io/component: ingestion
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: datamind-ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datamind-ingestion
        app.kubernetes.io/part-of: datamind
        app.kubernetes.io/component: ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/faizalkhan24/datamind-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: PREDICTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: PREDICTION_SERVICE_URL
            - name: FLEET_API_URL
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: FLEET_API_URL
            - name: STREAM_WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: STREAM_WORKER_CONCURRENCY
            - name: STREAM_QUEUE_MAX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: STREAM_QUEUE_MAX_SIZE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: LOG_LEVEL
            - name: ENABLE_PROMETHEUS_METRICS
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: ENABLE_PROMETHEUS_METRICS
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datamind-ingestion-hpa
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-ingestion-hpa
    app.kubernetes.io/part-of: datamind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datamind-ingestion
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
