apiVersion: v1
kind: Service
metadata:
  name: datamind-dashboard
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-dashboard
    app.kubernetes.io/part-of: datamind
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8003
      targetPort: 8003
  selector:
    app.kubernetes.io/name: datamind-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datamind-dashboard
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-dashboard
    app.kubernetes.io/part-of: datamind
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: datamind-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datamind-dashboard
        app.kubernetes.io/part-of: datamind
        app.kubernetes.io/component: dashboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      # [SECURITY-4]: Enforce non-root execution and runtime seccomp profile
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          # [SECURITY-4]: Drop all capabilities and prevent privilege escalation
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/faizalkhan24/datamind-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: FLEET_API_URL
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: FLEET_API_URL
            - name: PREDICTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: PREDICTION_SERVICE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: LOG_LEVEL
            - name: ENABLE_PROMETHEUS_METRICS
              valueFrom:
                configMapKeyRef:
                  name: datamind-config
                  key: ENABLE_PROMETHEUS_METRICS
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 600m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datamind-dashboard-hpa
  namespace: datamind
  labels:
    app.kubernetes.io/name: datamind-dashboard-hpa
    app.kubernetes.io/part-of: datamind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datamind-dashboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
