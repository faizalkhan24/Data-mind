# ==============================================================================
# DataMind: Master Multi-Service Docker Compose Orchestration
# 1-Command Local Deployment: docker compose -f infrastructure/docker/docker-compose.yml up -d
# ==============================================================================

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: datamind-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-datamind}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-datamind}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datamind-net

  redis:
    image: redis:7-alpine
    container_name: datamind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - datamind-net

  prediction:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.prediction
    container_name: datamind-prediction
    restart: unless-stopped
    ports:
      - "${DATAMIND_PREDICTION_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - datamind-net

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: datamind-api
    restart: unless-stopped
    ports:
      - "${DATAMIND_API_PORT:-8001}:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-datamind}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - datamind-net

  ingestion:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ingestion
    container_name: datamind-ingestion
    restart: unless-stopped
    ports:
      - "${DATAMIND_INGESTION_PORT:-8002}:8002"
    environment:
      - DATAMIND_PREDICTION_URL=http://prediction:8000
      - DATAMIND_API_URL=http://api:8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    depends_on:
      prediction:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - datamind-net

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: datamind-dashboard
    restart: unless-stopped
    ports:
      - "${DATAMIND_DASHBOARD_PORT:-8080}:8080"
    environment:
      - DATAMIND_API_URL=http://api:8001
      - DATAMIND_PREDICTION_URL=http://prediction:8000
      - DATAMIND_INGESTION_URL=http://ingestion:8002
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
      prediction:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - datamind-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: datamind-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - datamind-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: datamind-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - datamind-net

volumes:
  pgdata:
    name: datamind_pgdata
  redisdata:
    name: datamind_redisdata

networks:
  datamind-net:
    name: datamind_network
    driver: bridge
